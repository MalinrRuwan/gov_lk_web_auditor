<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Government website audit · {{URL}}</title>
    <style>
      :root {
        --ink: #17201d;
        --paper: #f4f6f2;
        --line: #cbd2cc;
        --green: #176b4d;
        --red: #a33b2b;
        --amber: #8a5a00;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: linear-gradient(120deg, #edf2ed, #f8f7f2);
        color: var(--ink);
        font:
          15px/1.5 Georgia,
          serif;
      }
      header,
      main {
        width: min(1100px, calc(100% - 32px));
        margin: auto;
      }
      header {
        padding: 56px 0 28px;
        border-bottom: 2px solid var(--ink);
      }
      .eyebrow {
        font:
          700 12px/1.2 ui-monospace,
          monospace;
        text-transform: uppercase;
      }
      h1 {
        margin: 8px 0;
        font-size: clamp(28px, 5vw, 54px);
        overflow-wrap: anywhere;
        letter-spacing: 0;
      }
      .result {
        display: flex;
        gap: 32px;
        flex-wrap: wrap;
        padding: 24px 0;
      }
      .metric strong {
        display: block;
        font:
          700 20px/1.3 ui-monospace,
          monospace;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 12px 0 56px;
        background: #fff;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        background: #e5e9e4;
        font:
          700 12px/1.2 ui-monospace,
          monospace;
        text-transform: uppercase;
      }
      .pass {
        color: var(--green);
      }
      .fail {
        color: var(--red);
      }
      .error,
      .review {
        color: var(--amber);
      }
      span {
        font:
          700 13px/1.3 ui-monospace,
          monospace;
      }
      @media (max-width: 640px) {
        header {
          padding-top: 32px;
        }
        th:nth-child(1),
        td:nth-child(1) {
          display: none;
        }
        td {
          padding: 10px 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="eyebrow">glwa · Website audit</div>
      <h1>{{URL}}</h1>
    </header>
    <main>
      <section class="result">
        <div class="metric">Finding<strong>{{STATUS}}</strong></div>
        <div class="metric">Confidence<strong>{{CONFIDENCE}}</strong></div>
        <div class="metric">Completed<strong>{{COMPLETED}}</strong></div>
      </section>
      <table>
        <thead>
          <tr>
            <th>Level</th>
            <th>Status</th>
            <th>Reason</th>
          </tr>
        </thead>
        <tbody>
          {{LEVEL_ROWS}}
        </tbody>
      </table>
      <table>
        <thead>
          <tr>
            <th>Check</th>
            <th>Status</th>
            <th>Evidence</th>
          </tr>
        </thead>
        <tbody>
          {{ROWS}}
        </tbody>
      </table>
    </main>
  </body>
</html>
